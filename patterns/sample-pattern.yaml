name: Simple Dishcloth
description: A beginner-friendly dishcloth pattern with a textured border.
notes: This pattern uses simple knit and purl stitches. Great for learning!

skillLevel: Beginner

materials:
  - Cotton yarn, worsted weight, approx 50g
  - US 7 (4.5mm) needles
  - Tapestry needle for weaving in ends

gauge:
  stitches: 18
  rows: 24
  unit: 4 inches

abbreviations:
  k: knit
  p: purl
  sts: stitches
  k2tog: knit 2 together
  ssk: slip, slip, knit

# Sizes allow variable substitution using {variableName}
sizes:
  - name: Small (8")
    stitches: 34
    borderRepeats: 3
  - name: Medium (10")
    stitches: 42
    borderRepeats: 4
  - name: Large (12")
    stitches: 50
    borderRepeats: 5

sections:
  - name: Cast On
    instructions:
      - Cast on {stitches} stitches
      - "Tip: Use a long-tail cast on for a neat edge"

  - name: Border
    instructions:
      - repeat: "{borderRepeats}"
        steps:
          - "Row 1: Knit all stitches"
          - "Row 2: Knit 3, purl to last 3 sts, knit 3"

  - name: Body
    instructions:
      - repeat: 20
        steps:
          - "Row 1 (RS): Knit all stitches"
          - "Row 2 (WS): Knit 3, purl to last 3 sts, knit 3"

  - name: Border (Top)
    instructions:
      - repeat: "{borderRepeats}"
        steps:
          - "Row 1: Knit all stitches"
          - "Row 2: Knit 3, purl to last 3 sts, knit 3"

  - name: Bind Off
    instructions:
      - Bind off all stitches loosely
      - Cut yarn, leaving a 6" tail
      - Weave in all ends
      - Block if desired
      - "🎉 You're done! Enjoy your new dishcloth!"